name: hf-mirror-drift-check

# Pull requests prove the offline contract. The scheduled protected-main job is
# the authoritative anonymous immutable-revision readback.
on:
  pull_request:
    paths:
      - ".github/workflows/hf-mirror.yml"
      - ".github/workflows/hf-mirror-drift-check.yml"
      - "scripts/hf_mirror.py"
      - "scripts/hf_mirror_drift_check.py"
      - "requirements/hf-mirror.lock"
      - "tests/test_hf_mirror_contract.py"
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the exact PR merge commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.14"
          check-latest: false
      - name: Verify offline mirror contract
        run: python -I -B tests/test_hf_mirror_contract.py

  live-readback:
    if: >-
      github.event_name == 'schedule' &&
      github.repository == 'szl-holdings/governed-inference-meter' &&
      github.ref == 'refs/heads/main' &&
      github.sha == github.workflow_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_TOKEN: ""
      HUGGING_FACE_HUB_TOKEN: ""
      HUGGINGFACE_TOKEN: ""
      HUGGINGFACEHUB_API_TOKEN: ""
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Checkout the admitted protected-main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.14"
          check-latest: false
      - name: Verify offline mirror contract
        run: python -I -B tests/test_hf_mirror_contract.py
      - name: Install the reviewed binary-only HF client closure
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: --require-hashes --no-deps
          -r requirements/hf-mirror.lock
      - name: Verify locked environment
        run: |
          python -m pip check
          python -I -B -c "import importlib.metadata as m; assert m.version('huggingface-hub') == '1.29.0'"
      - name: Verify closed payload at one immutable HF revision
        env:
          HF_HOME: ${{ runner.temp }}/hf-home-empty
          HF_HUB_CACHE: ${{ runner.temp }}/hf-cache
        run: python -I -B scripts/hf_mirror_drift_check.py
