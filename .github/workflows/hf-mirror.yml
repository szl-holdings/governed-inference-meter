name: hf-mirror

# Privileged publication is intentionally a separate, protected-main-only
# transaction. This workflow is never selected from a tag, release, or branch.
on:
  repository_dispatch:
    types: [hf-mirror-source-bound]

permissions:
  contents: read

concurrency:
  group: hf-mirror-protected-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'szl-holdings/governed-inference-meter' &&
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'hf-mirror-source-bound' &&
      github.ref == 'refs/heads/main' &&
      github.sha == github.workflow_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Checkout the admitted protected-main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.14"
          check-latest: false
      - name: Verify offline mirror contract before dependency or credential access
        run: python -I -B tests/test_hf_mirror_contract.py
      - name: Install the reviewed binary-only HF client closure
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: --require-hashes --no-deps
          -r requirements/hf-mirror.lock
      - name: Verify locked environment
        run: |
          python -m pip check
          python -I -B -c "import importlib.metadata as m; assert m.version('huggingface-hub') == '1.29.0'"
      - name: Publish once with parent CAS and immutable anonymous readback
        env:
          HF_HOME: ${{ runner.temp }}/hf-home
          HF_HUB_CACHE: ${{ runner.temp }}/hf-cache
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -I -B scripts/hf_mirror.py
